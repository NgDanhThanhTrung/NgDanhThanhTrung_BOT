name: NgDanhThanhTrung_BOT Manual Runner

on:
  # Loại bỏ schedule để bot không tự chạy lung tung
  # Chỉ giữ lại workflow_dispatch để bạn bật thủ công
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # Tự động ngắt toàn bộ job sau 120 phút (2 tiếng)
    timeout-minutes: 120 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MY_TELEGRAM_ID: "7346983056"
        run: python bot.py
